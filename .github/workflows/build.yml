name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FluxEngine.slnx

      - name: Build
        run: dotnet build FluxEngine.slnx --configuration Release --no-restore

      - name: Run regression tests
        run: dotnet run --project tests/FluxEngine.RegressionTests/FluxEngine.RegressionTests.csproj --configuration Release --no-build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: FluxEngine-Release
          path: build/
          if-no-files-found: error
          retention-days: 14
